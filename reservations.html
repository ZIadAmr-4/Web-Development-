<!doctype html>
<html> 

<body>
  <h1 id="title">Welcome</h1>

  <input id="name" placeholder="Your name" />
  <button id="greet">Greet</button>

  <ul id="list"></ul>

  <script>
    function addName() {
      const input = document.getElementById('name');
      const name = input.value.trim();

      if (!name) return;

      document.getElementById('title').textContent = `Hello, ${name}`;

      const li = document.createElement('li');
      li.textContent = name;
      document.getElementById('list').appendChild(li);

      input.value = '';
    }

    function removeName(e) {
      if (e.target.nodeName === 'LI') {
        const name = e.target.textContent;

        document.getElementById('title').textContent =
          `Goodbye, ${name}! see you later.`;

        e.target.remove();
      }
    }

    document.getElementById('greet').addEventListener('click', addName);
    document.getElementById('list').addEventListener('click', removeName);
  </script>
</body>
</html>

<head>
  <title>Welcome Page</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: hsl(244, 38%, 25%);
    }

    h1 {
      color: #edeff3;
    }

    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    li {
      margin: 10px auto;
      padding: 8px;
      background-color: white;
      width: 200px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
